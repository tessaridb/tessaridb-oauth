[package]
name = "tessari-oauth-storage"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
# Integration tests are declared one binary per crate when they exist; never one per file under `tests/`.
autotests = false

# The live tests: one binary, every test `#[ignore]`d unless a node is named (see tests/live/main.rs).
[[test]]
name = "live"
path = "tests/live/main.rs"

[lib]
doctest = false

[dependencies]
tessari-oauth-constants.workspace = true
tessari-oauth-core.workspace = true
tessari-oauth-infrastructure.workspace = true
tessari-oauth-types.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tessari-oauth-test-support.workspace = true
png.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
