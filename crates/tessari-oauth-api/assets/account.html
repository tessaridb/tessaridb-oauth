<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Your account</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/pages.css">
  <script src="assets/account.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to your account</a>
  <main id="main" class="page" tabindex="-1">
    <section class="card wide" aria-labelledby="title">
      <header class="brand">
        <img src="assets/mark.svg" alt="" width="32" height="32">
        <span>TessariDB</span>
      </header>
      <h1 id="title" tabindex="-1">Your account</h1>
      <p id="status" class="status" role="status" aria-live="polite">Loading your account.</p>

      <div id="account" class="sections" hidden>
        <section aria-labelledby="who-title">
          <h2 id="who-title">Signed in as</h2>
          <p class="who"><strong id="email"></strong> <span id="verified" class="badge"></span></p>
        </section>

        <section aria-labelledby="methods-title">
          <h2 id="methods-title">How you sign in</h2>
          <dl class="facts">
            <dt>Password</dt><dd id="method-password"></dd>
            <dt>Authenticator app</dt><dd id="method-totp"></dd>
            <dt>Recovery codes</dt><dd id="method-recovery"></dd>
          </dl>
          <h3 id="passkeys-title">Passkeys</h3>
          <ul id="passkeys" class="rows" aria-labelledby="passkeys-title"></ul>
        </section>

        <section aria-labelledby="sessions-title">
          <h2 id="sessions-title" tabindex="-1">Where you're signed in</h2>
          <ul id="sessions" class="rows" aria-labelledby="sessions-title"></ul>
          <div class="actions">
            <button type="button" id="everywhere" class="secondary">Sign out everywhere</button>
          </div>
          <div id="everywhere-confirm" class="confirm" hidden>
            <p id="everywhere-warning"></p>
            <div class="actions">
              <button type="button" id="everywhere-yes" class="danger">Sign out everywhere</button>
              <button type="button" id="everywhere-no" class="secondary">Keep me signed in</button>
            </div>
          </div>
        </section>

        <section aria-labelledby="grants-title">
          <h2 id="grants-title" tabindex="-1">Applications with access</h2>
          <ul id="grants" class="rows" aria-labelledby="grants-title"></ul>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
