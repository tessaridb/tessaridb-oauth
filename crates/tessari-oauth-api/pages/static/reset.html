<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/pages.css">
  <link rel="stylesheet" href="../assets/brand.css">
  <script src="../assets/reset.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to the new password</a>
  <main id="main" class="page" tabindex="-1">
    <section class="card" aria-labelledby="title">
      <header class="brand">
        <img id="brand-logo" src="../assets/mark.svg" alt="" width="32" height="32">
        <span id="brand-name">TessariDB OAuth</span>
      </header>
      <h1 id="title">Choose a new password</h1>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <form id="reset" class="step" hidden novalidate>
        <div class="field">
          <label for="new-password">New password</label>
          <div class="with-toggle">
            <input id="new-password" name="new-password" type="password" autocomplete="new-password" required
                   aria-required="true" aria-describedby="new-password-hint new-password-error">
            <button type="button" id="reveal" class="quiet" aria-pressed="false"
                    aria-controls="new-password">Show</button>
          </div>
          <p id="new-password-hint" class="hint"></p>
          <p id="new-password-error" class="field-error" hidden></p>
        </div>
        <button type="submit" class="primary">Save new password</button>
      </form>
      <p id="brand-links" class="brand-links" hidden>
        <a id="brand-support" class="quiet-link" rel="noreferrer" hidden>Help</a>
        <a id="brand-privacy" class="quiet-link" rel="noreferrer" hidden>Privacy</a>
      </p>
    </section>
  </main>
</body>
</html>
