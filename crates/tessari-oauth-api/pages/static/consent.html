<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Allow access</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/pages.css">
  <link rel="stylesheet" href="assets/brand.css">
  <script src="assets/consent.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to the request</a>
  <main id="main" class="page" tabindex="-1">
    <section class="card" aria-labelledby="title">
      <header class="brand">
        <img id="brand-logo" src="assets/mark.svg" alt="" width="32" height="32">
        <span id="brand-name">TessariDB OAuth</span>
      </header>
      <h1 id="title">Allow access?</h1>
      <p id="status" class="status" role="status" aria-live="polite">Checking what the application asks for.</p>

      <div id="request" hidden>
        <p>The application <strong><code id="client"></code></strong> is asking for:</p>
        <ul id="scopes" class="asks"></ul>
        <div id="resources-block" hidden>
          <p>At these services:</p>
          <ul id="resources" class="asks"></ul>
        </div>
        <div class="actions">
          <button type="button" id="allow" class="primary">Allow access</button>
          <button type="button" id="deny" class="secondary">Deny</button>
        </div>
      </div>
      <p id="brand-links" class="brand-links" hidden>
        <a id="brand-support" class="quiet-link" rel="noreferrer" hidden>Help</a>
        <a id="brand-privacy" class="quiet-link" rel="noreferrer" hidden>Privacy</a>
      </p>
    </section>
  </main>
</body>
</html>
