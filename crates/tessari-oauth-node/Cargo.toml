[package]
name = "tessari-oauth-node"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "tessaridb-oauth"
path = "src/main.rs"
# The composition root holds no logic to test; its behaviour is tested in the crates it wires.
test = false

[dependencies]
tessari-oauth-constants.workspace = true
tessari-oauth-types.workspace = true
tessari-oauth-core.workspace = true
tessari-oauth-observability.workspace = true
tessari-oauth-infrastructure.workspace = true
tessari-oauth-storage.workspace = true
tessari-oauth-api.workspace = true
tessari-oauth-daemons.workspace = true
rustls.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros"] }

[lints]
workspace = true
