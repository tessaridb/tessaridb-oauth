[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A workspace path dependency has no version to range over and no publisher but us; cargo-deny reads the internal
# crates as wildcards. The exemption covers path dependencies only — a registry wildcard is still refused.
allow-wildcard-paths = true

[licenses]
version = 2
# Licences acceptable in third-party dependencies; this work's own licence is BUSL-1.1 converting to Apache 2.0 on
# the Change Date (see LICENSE). Copyleft, weak copyleft included, is a blocking finding: the eventual Apache 2.0
# conversion has to be honourable, and a copyleft dependency would make it impossible. An exception names one crate
# and the reason, never a licence for everything.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }
# `quoted_printable` (the mail body encoding lettre uses) is 0BSD: permission to use for any purpose with no
# condition at all, so it imposes nothing the Apache 2.0 conversion could not honour.
exceptions = [{ crate = "quoted_printable", allow = ["0BSD"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The database client does not publish to a registry, so it arrives by git. The allowance names the one repository
# rather than the organisation: an org-wide allowance would cover every repository added under that name later.
allow-git = ["https://github.com/tessaridb/tessaridb-sdk-rust.git"]
